/* Dedicated partner mobile experience; desktop reporting is unchanged. */
.m-workspace{min-height:100dvh;background:#faf9f6;color:#23251f;max-width:760px;margin:auto}

.m-page{padding:18px 20px calc(92px + env(safe-area-inset-bottom,0px));display:grid;gap:22px;outline:none}

.m-earn{display:flex;align-items:center;justify-content:space-between;gap:15px;text-align:left;width:100%;border:0;background:#252a23;color:#fcfaf2;padding:17px 18px;border-radius:5px;min-height:110px}.m-earn>div{display:grid;gap:3px;min-width:0}.m-earn small,.m-earn div>span{font-size:11px;color:#d0caba}.m-earn strong{font:500 32px/1.1 var(--serif);overflow-wrap:anywhere}.m-earn>span{font-size:28px;color:#d0caba}

.m-record{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #e2e1d8;min-width:0}.m-record>div{display:grid;gap:4px;min-width:0}.m-record strong{font-size:13px;font-weight:600;overflow-wrap:anywhere}.m-record small{font-size:11px;color:#68695f}.m-record-end{justify-items:end;text-align:right}.m-record-end .pill{max-width:100%;white-space:normal}.m-record:last-child{border-bottom:0}
.m-disclosure{border-block:1px solid #deded5;padding:11px 0;color:#68695f;font-size:12px}.m-disclosure summary{cursor:pointer;min-height:24px;font-weight:600;color:#23251f}.m-disclosure p{margin:7px 0}
.m-segments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid #deded5}.m-segments button{background:transparent;border:0;border-bottom:2px solid transparent;color:#68695f;min-height:44px;font-size:13px;font-weight:600}.m-segments button[aria-pressed=true]{border-color:#81734d;color:#23251f}
.m-finance{display:grid;gap:5px;padding:18px 0;border-block:1px solid #deded5}.m-finance>small{font-size:11px;color:#68695f}.m-finance>strong{font:500 38px/1.1 var(--serif);overflow-wrap:anywhere}.m-finance-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.m-finance-grid>div{display:grid;gap:4px;min-width:0}.m-finance-grid>div+div{border-left:1px solid #deded5;padding-left:12px}.m-finance-grid small{font-size:11px;color:#68695f}.m-finance-grid b{font:500 23px/1.1 var(--serif);overflow-wrap:anywhere}
.m-data-note{font-size:10px;color:#77776a}.m-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fffefa;border-top:1px solid #deded5;padding:4px 8px calc(5px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px #25251b08}.m-nav button{background:transparent;color:#68695f;border:0;min-height:55px;display:grid;justify-items:center;align-content:center;gap:3px;font-size:10px;font-weight:500}.m-nav button .icon{width:21px;height:21px}.m-nav button[aria-current=page]{color:#272b22;font-weight:700}.m-nav button[aria-current=page] .icon{color:#81734d}.m-nav button[aria-current=page] span{border-bottom:1px solid #81734d}
@media(max-width:360px){.m-top{padding:12px 14px}.m-page{padding-inline:14px;gap:19px}.m-welcome h1{font-size:30px}.m-link .button{font-size:11px;padding-inline:9px}.m-stats small{font-size:9px}.m-stats strong{font-size:29px}.m-earn strong{font-size:29px}}
