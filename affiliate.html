<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#421909" />
<title>PLP | Partner Workspace</title>
<link rel="icon" href="/favicon.svg" />
<style>
:root{color-scheme:light;--ink:#241f1b;--muted:#71685f;--paper:#f8f5ef;--white:#fffdf9;--line:#e6ded2;--brand:#421909;--accent:#806b3d;--green:#335748;--error:#9a382e;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #a58242;outline-offset:3px}a{color:inherit}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400}h1{font-size:clamp(30px,4vw,46px);line-height:1.12;letter-spacing:-.025em}h2{font-size:23px;line-height:1.25}h3{font-size:14px;font-weight:600}.muted,small{color:var(--muted)}small{font-size:12px}.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.17em;color:var(--accent)}.button{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:11px 17px;min-height:44px;border-radius:5px;font-weight:600;white-space:normal}.button.secondary{background:transparent;color:var(--brand);border-color:#cfc4b4}.button.ghost{background:transparent;color:inherit;border-color:transparent}.button:hover:not(:disabled){filter:brightness(.92)}.brandmark{width:48px;height:48px;object-fit:contain;flex:none}.brandline{display:flex;gap:12px;align-items:center}.brandname{font-family:Georgia,serif;letter-spacing:.015em;font-size:19px;line-height:1.15}.brandcaption{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}.loading{min-height:100dvh;display:grid;place-content:center;gap:14px;text-align:center;color:var(--muted)}
#app[hidden],#status[hidden],.loading[hidden]{display:none!important}#status{position:fixed;z-index:20;top:14px;right:16px;max-width:min(420px,calc(100vw - 32px));padding:12px 18px;border:1px solid var(--line);background:var(--white);box-shadow:0 5px 25px #2e231217;border-radius:6px;color:var(--green);font-size:13px}#status.error{color:var(--error);border-color:#e3b9b1}
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100dvh}.auth-brand{background:var(--brand);color:#faf1e0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,6vw,84px);gap:40px}.auth-brand .brandcaption,.auth-brand .eyebrow{color:#e2ccb0}.auth-brand .brandmark{background:#faf1e0;border-radius:50%;padding:4px}.auth-brand h1{font-size:clamp(38px,5vw,64px);max-width:500px}.auth-brand p{max-width:390px;color:#e6d4bf;margin-top:20px}.auth-brand footer{color:#d9c4ac;font-size:12px}.auth-main{display:grid;place-items:center;padding:32px 24px}.auth-form{width:min(100%,420px);display:grid;gap:18px}.auth-form h2{font-size:34px}.auth-form form{display:grid;gap:15px}.auth-form label{display:grid;gap:6px;font-size:12px;font-weight:600}input,select{border:1px solid #d9cfc1;border-radius:5px;background:var(--white);color:var(--ink);min-height:44px;padding:10px 12px;min-width:0;width:100%}.auth-form .button{width:100%}.auth-divider{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
.workspace{min-height:100dvh;display:grid;grid-template-columns:246px minmax(0,1fr)}.sidebar{background:var(--white);border-right:1px solid var(--line);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:26px 18px;gap:34px}.sidebar .brandline{padding:0 5px}.navlabel{padding:0 12px 8px}.nav{display:grid;gap:4px}.nav button{display:flex;gap:11px;align-items:center;text-align:left;border:0;background:transparent;color:#62574d;padding:12px;min-height:44px;border-radius:5px;font-size:13px;font-weight:500}.nav button[aria-current=page]{color:var(--brand);background:#f1e8db;font-weight:650}.nav button:hover{background:#f5eee4}.nav svg,.icon{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.sidebar-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:12px}.sidebar-foot p{font-size:12px;color:var(--muted)}.content{min-width:0}.topbar{min-height:74px;border-bottom:1px solid var(--line);padding:14px clamp(18px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--white)}.topbar-left{display:flex;gap:10px;align-items:center;font-weight:600}.topbar-actions{display:flex;align-items:center;gap:14px}.profile{display:flex;align-items:center;gap:9px;min-width:0}.profile div{min-width:0}.profile strong{display:block;font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.avatar{display:grid;place-items:center;background:#eee3d2;color:var(--brand);border-radius:50%;width:35px;height:35px;font-weight:600;flex:none}.mobile-menu{display:none}.page{max-width:1400px;margin:auto;padding:32px clamp(18px,4vw,48px) 60px;display:grid;gap:22px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.page-head p{margin-top:7px;font-size:13px}.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;border:1px solid #ded4c3;color:#705932;background:#f5ecdd;border-radius:20px;padding:4px 9px;max-width:100%;white-space:normal}.pill.good{color:#315947;border-color:#d9e4da;background:#edf3eb}.pill.bad{color:#8f3e36;background:#faf0eb;border-color:#ecd5ce}.notice{display:flex;align-items:flex-start;gap:10px;border:1px solid #e4d4b8;background:#faf2e3;padding:12px 15px;border-radius:5px;color:#67502c;font-size:12px}.notice strong{display:block;margin-bottom:2px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric,.panel{background:var(--white);border:1px solid var(--line);border-radius:7px;min-width:0}.metric{padding:18px;display:grid;gap:10px;align-content:start}.metric-label{display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.metric-value{font-family:Georgia,serif;font-size:clamp(25px,3vw,35px);line-height:1.13;color:var(--brand);overflow-wrap:anywhere}.metric small{font-size:11px}.grid-two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px}.panel{padding:22px;display:grid;gap:17px;align-content:start}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.panel-head p{margin-top:5px;font-size:12px}.linkrow{display:flex;gap:8px;align-items:center}.linkrow input{flex:1;min-width:0;font-size:12px;background:#f7f3ed}.linkrow button{flex:none}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;color:var(--brand)}.progress-row{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:12px}.track{grid-column:1/-1;height:6px;border-radius:6px;background:#eee8df;overflow:hidden}.track span{display:block;height:100%;background:#9b865e;border-radius:6px}.table-wrap{overflow-x:auto;max-width:100%;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:650;background:#f7f3ec}th,td{padding:13px 12px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}.empty{min-height:146px;display:grid;place-content:center;text-align:center;gap:8px;padding:24px;color:var(--muted);border:1px dashed var(--line);border-radius:5px}.empty svg{margin:auto;color:var(--accent);width:28px;height:28px}.empty strong{color:var(--ink)}.text-button{background:none;border:0;color:var(--brand);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:5px;min-height:34px}.filter{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.filter select{width:auto;max-width:100%;min-height:38px;font-size:12px}.detail-list{display:grid;gap:0}.detail-list div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.detail-list div:last-child{border-bottom:0}.detail-list dt{color:var(--muted)}.detail-list dd{margin:0;text-align:right;overflow-wrap:anywhere}.overlay{display:none}
@media(max-width:1050px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.workspace{display:block}.sidebar{position:fixed;z-index:30;left:0;top:0;bottom:0;height:100dvh;width:min(290px,85vw);transform:translateX(-110%);transition:transform .18s ease}.workspace.menu-open .sidebar{transform:translateX(0)}.workspace.menu-open .overlay{display:block;position:fixed;inset:0;z-index:29;background:#211a1670;border:0}.mobile-menu{display:inline-grid;place-items:center;min-height:40px;width:40px;background:none;border:1px solid var(--line);border-radius:5px;color:var(--brand)}.topbar{min-height:62px;padding:10px 16px}.topbar .topbar-left>span{font-size:12px}.topbar-actions{gap:8px}.profile div{display:none}.page{padding:24px 16px 40px;gap:16px}.page-head{align-items:flex-start;flex-direction:column}.metric-grid{gap:10px}.metric{padding:14px;gap:8px}.metric-value{font-size:26px}.panel{padding:16px;gap:14px}.panel-head{flex-wrap:wrap}.linkrow{flex-wrap:wrap}.linkrow input{flex-basis:100%}.linkrow .button{width:100%}.auth{grid-template-columns:1fr}.auth-brand{min-height:230px;padding:28px 24px;gap:20px}.auth-brand h1{font-size:36px}.auth-brand p{margin-top:8px;font-size:13px}.auth-brand footer{display:none}.auth-main{padding:28px 24px 40px}.auth-form h2{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="loading" class="loading"><img class="brandmark" src="/brand/PLP_Editorial_Vector_Logo.svg" alt="" style="margin:auto"><p>Opening partner workspace…</p></main>
<p id="status" role="status" aria-live="polite" hidden></p>
<div id="app" hidden></div>
<script type="module" src="/src/affiliate.js"></script>
</body>
</html>
