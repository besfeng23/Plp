<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Pueblo La Perla partner portal</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root { --ink:#1A1A1A; --paper:#FAFAF7; --line:#ded8cd; --muted:#625c4e; --brass:#746130; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 Georgia, serif; }
    main { max-width: 720px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1,h2 { font-weight: 400; letter-spacing: .02em; }
    p { color: var(--muted); }
    .bar { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1.25rem 0 2rem; }
    .bar input { flex: 1; min-width: 12rem; min-height: 44px; border: 1px solid var(--line); background: #fff; padding: .6rem .8rem; font: inherit; }
    button { min-height: 44px; border: 1px solid var(--ink); background: var(--ink); color: #fff; padding: .6rem 1rem; font: 600 12px/1.2 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    nav button { background: transparent; color: var(--ink); }
    nav button[aria-current="page"] { background: var(--ink); color: #fff; }
    article { padding: 1rem 0; border-top: 1px solid var(--line); }
    .error { color: #8a3a2a; }
  </style>
</head>
<body>
  <main>
    <p style="letter-spacing:.18em;text-transform:uppercase;font:700 11px Inter,sans-serif;color:var(--brass)">Pueblo La Perla</p>
    <h1>Partner portal</h1>
    <p id="status">Checking your invitation…</p>
    <div id="app" hidden></div>
  </main>
  <script type="module" src="/src/affiliate.js"></script>
</body>
</html>
