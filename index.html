    <style>
      :root{color-scheme:light;background:#050505;color:#fff;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
      body{margin:0;min-width:320px;min-height:100vh;background:#050505;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      .skip-link{position:fixed;left:max(1rem,env(safe-area-inset-left,0px));top:0;z-index:9999;transform:translateY(calc(-100% - 1rem));opacity:0;pointer-events:none;background:#1a1a1a;color:#fff;padding:.75rem 1rem;border-radius:0 0 .25rem .25rem;box-shadow:0 10px 24px rgba(0,0,0,.18)}
      .skip-link:focus,.skip-link:focus-visible{transform:translateY(max(.75rem,env(safe-area-inset-top,0px)));opacity:1;pointer-events:auto}
      html.plp-app-gating:not(.plp-app-ready) #root{visibility:hidden}
      html.plp-app-ready #root{visibility:visible}
      .initial-shell{position:fixed;inset:0;z-index:2147483000;min-height:100svh;display:grid;place-items:center;overflow-y:auto;background:#050505;color:#fff;padding:calc(4rem + var(--safe-top)) 1.5rem calc(4rem + var(--safe-bottom));font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;transition:opacity .22s ease,visibility .22s ease}
      html.plp-app-ready .initial-shell{opacity:0;visibility:hidden;pointer-events:none}
      .initial-shell::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,.22),rgba(5,5,5,.72)),url('/images/plp-hero-sunset.webp') center/cover no-repeat;opacity:.9}
      .initial-shell__content{position:relative;z-index:1;max-width:42rem}
      .initial-shell__kicker{margin:0 0 1.5rem;font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.86)}
      .initial-shell__title{margin:0 0 1.5rem;font-family:Georgia,'Times New Roman',serif;font-size:clamp(3rem,12vw,5.5rem);font-weight:400;line-height:.94;letter-spacing:.04em}
      .initial-shell__copy{margin:0 auto;max-width:34rem;font-size:.95rem;line-height:1.8;color:rgba(255,255,255,.82)}
      .initial-shell__loading{margin-top:2rem;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65)}
      .initial-shell__links{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-top:1.75rem}
      .initial-shell__links a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid rgba(255,255,255,.65);padding:.65rem 1.1rem;font-size:.875rem;color:#fff;text-decoration:none}
      .initial-shell__links a:focus-visible{outline:2px solid #fff;outline-offset:3px}
    </style>
