name: PLP Booking Safety

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/plp-booking-atomic-safety

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Validate mobile viewport safe areas
        run: npm run check:viewport

      - name: Build PLP
        run: npm run build
